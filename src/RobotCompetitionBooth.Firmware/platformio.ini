[platformio]
default_envs = esp32-s3-n16r8

[env:esp32-s3-n16r8]
platform = platformio/espressif32@7.0.1
board = esp32-s3-n16r8
framework = arduino

upload_port = COM4
monitor_port = COM4
monitor_speed = 115200

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    h2zero/NimBLE-Arduino@2.5.1
    256dpi/MQTT@2.5.3
    bblanchon/ArduinoJson@7.4.2
